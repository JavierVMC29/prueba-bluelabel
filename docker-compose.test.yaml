name: prueba_bluelabel_test

services:
  prueba_bluelabel_mysql_test:
    image: mysql:8.0
    container_name: prueba_bluelabel_mysql_test
    ports:
      - '3307:3306' # Puerto EXTERNO diferente (3307), interno sigue siendo 3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bluelabel-test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    # Usar tmpfs (RAM) en vez de disco duro.
    # Hace que los tests corran 2x o 3x más rápido.
    tmpfs:
      - /var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - prueba_bluelabel_network_test

networks:
  prueba_bluelabel_network_test:
    driver: bridge
